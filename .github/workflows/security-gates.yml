name: Security Gates

on:
  push:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/security-gates.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/security-gates.yml'
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-and-image-scan:
    env:
      NODE_BASE_DIGEST: ${{ vars.NODE_BASE_DIGEST }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability gate (npm audit)
        run: npm audit --audit-level=high

      - name: Resolve digest pin input
        id: digest
        run: |
          if [ -n "$NODE_BASE_DIGEST" ]; then
            echo "has_digest=true" >> "$GITHUB_OUTPUT"
            echo "Using pinned digest: $NODE_BASE_DIGEST"
          else
            echo "has_digest=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: NODE_BASE_DIGEST repo variable is missing; image build+image-scan steps are skipped." 
          fi

      - name: Build backend image
        if: steps.digest.outputs.has_digest == 'true'
        run: docker build --build-arg NODE_BASE_DIGEST=$NODE_BASE_DIGEST -t smartcart-backend:security-gate -f Dockerfile .

      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy image scan (HIGH/CRITICAL)
        if: steps.digest.outputs.has_digest == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'smartcart-backend:security-gate'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: spdx-json
          output-file: ./backend/sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SBOM blob (keyless)
        run: cosign sign-blob --yes --bundle sbom.bundle.json sbom.spdx.json

      - name: Verify SBOM signature
        run: |
          cosign verify-blob \
            --bundle sbom.bundle.json \
            --certificate-identity-regexp ".*" \
            --certificate-oidc-issuer-regexp "https://token.actions.githubusercontent.com|https://accounts.google.com" \
            sbom.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: |
            backend/sbom.spdx.json
            backend/sbom.bundle.json

  abuse-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run abuse suite
        run: node --test test/abuse-suite.test.js
